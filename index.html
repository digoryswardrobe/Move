<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --text:#111113; --muted:#6e6e73; --line:#e5e5ea;
  --field:#f0f0f3; --accent:#0e9f6e; --on-accent:#ffffff; --danger:#d92d20;
  --g1:#f6fcf8; --g2:#dcf3e4; --g3:#cfe9d8;   /* physio: very pale green */
  --b1:#f6fafe; --b2:#dbe9fa; --b3:#cddff5;   /* gym: very pale blue */
  --glow:rgba(255,212,84,.22); --glow-mid:rgba(255,212,84,.075);   /* faint yellow page glow */
  --panel:rgba(255,255,255,.66);              /* see-through panels so the glow shows */
  --physio:#2f9e6b; --physio-soft:#f8fcfa; --physio-line:#e0f0e6;
  --gym:#3b7bdc;    --gym-soft:#f8fafe;    --gym-line:#dfe8f7;
  --band:#f8ecae; --band-text:#141414;
  --soft:#f8f8f7;   --soft-line:#efeff2;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1c1c1e; --text:#f5f5f7; --muted:#8e8e93; --line:#2c2c2e;
    --field:#2c2c2e; --accent:#30d158; --on-accent:#00210c; --danger:#ff6961;
    --g1:#161d19; --g2:#1b2c22; --g3:#25382c;
    --b1:#16191e; --b2:#1a2536; --b3:#243146;
    --glow:rgba(255,212,84,.10); --glow-mid:rgba(255,212,84,.035);
    --panel:rgba(28,28,30,.66);
    --physio:#3ecf8e; --physio-soft:#222b26; --physio-line:#2c3b32;
    --gym:#6ea8ff;    --gym-soft:#212733;    --gym-line:#2c3648;
    --band:#4a4118; --band-text:#f6efd0;
    --soft:#262626;   --soft-line:#323236;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;color:var(--text);overflow-x:hidden}
html{background:var(--bg)}
/* Faint yellow glow, deepest at the bottom-right corner, fading to nothing. Fixed so it stays put while scrolling. */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(150% 115% at 100% 100%, var(--glow) 0%, var(--glow-mid) 42%, transparent 82%)}
body{
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 16px)
          calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 16px);
  touch-action:manipulation;
}
#app{max-width:560px;margin:0 auto;--sec:var(--text);--sec-soft:var(--soft);--sec-line:var(--soft-line)}
#app[data-sec=physio]{--sec:var(--text);--sec-soft:var(--physio-soft);--sec-line:var(--physio-line)}
#app[data-sec=gym]{--sec:var(--text);--sec-soft:var(--gym-soft);--sec-line:var(--gym-line)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:active{opacity:.6}

/* yellow band across the top of every page */
.band{background:var(--band);color:var(--band-text);
  margin:calc(-1 * (env(safe-area-inset-top) + 8px)) calc(-1 * (env(safe-area-inset-right) + 16px)) 14px calc(-1 * (env(safe-area-inset-left) + 16px));
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 16px) 14px calc(env(safe-area-inset-left) + 16px)}
.band{box-shadow:0 0 0 100vmax var(--band);clip-path:inset(0 -100vmax)}
.band .icon{color:inherit;opacity:.7}
.btn.go{background:var(--band);color:var(--band-text)}
/* headings */
.home{display:flex;flex-direction:column;
  min-height:calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 36px);
  min-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 36px)}
.mid{display:flex;flex-direction:column}
.mid .big:last-child{margin-bottom:0}
.hdr{display:flex;align-items:center;justify-content:space-between;min-height:48px}
h1{font-size:34px;font-weight:400;margin:0;letter-spacing:-.02em;font-style:italic;letter-spacing:0}
h2{font-size:30px;font-weight:400;margin:2px 0 4px;letter-spacing:-.02em}
.icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-right:-10px;color:var(--muted)}
.wk{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:15px;margin:2px 0 18px}
.wk b{color:var(--text);font-weight:400}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin:0 -6px}
.top button{min-height:44px;padding:0 6px;font-size:17px}
.top .edit{font-weight:400}
.grp{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin:22px 4px 8px}

/* home buttons */
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%;min-height:124px;
  border-radius:20px;margin-bottom:14px;background:var(--card);border:1px solid var(--line)}
.big .t{font-size:32px;font-weight:400;letter-spacing:0}
.dots{display:flex;gap:8px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted)}
.dots i.on{background:var(--text);border-color:var(--text)}

/* grouped panels */
.panel{background:var(--panel);border-radius:16px;overflow:hidden}
.panel.now{box-shadow:0 0 0 2px var(--sec)}
.row{display:flex;align-items:stretch;min-height:56px}
.row + .row,.ex + .ex,.heads + .ex,.ex + .addrow{border-top:1px solid var(--line)}
.tick{width:56px;flex:none;display:flex;align-items:center;justify-content:center}
.tick i{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;
  font-style:normal;font-size:14px;font-weight:800;color:transparent;opacity:.7}
.tick.on i{background:var(--sec);border-color:var(--sec);color:var(--bg);opacity:1}
.open{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;
  padding:0 16px 0 0;font-size:17px;font-weight:400}
.open.solo{padding-left:16px}
.open .meta{color:var(--muted);font-weight:400;font-size:15px;white-space:nowrap}
.chev{color:var(--muted);font-weight:400;font-size:20px}

/* exercise rows */
.heads,.ex{display:flex;align-items:center;gap:8px;padding:0 10px 0 14px}
.heads{padding-top:8px;padding-bottom:4px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.heads .sp{flex:1}
.heads span{text-align:center}
.ex{min-height:60px;padding-top:8px;padding-bottom:8px}
.nm{flex:1;min-width:0;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.vals{display:flex;gap:5px;flex:none}
.wn{width:42px} .ww{width:60px} .wb{width:88px}
.vals input,.vals select{height:44px;border:0;border-radius:10px;background:var(--soft);text-align:center;text-align-last:center;
  font-weight:300;padding:0 2px;margin:0;-webkit-appearance:none;appearance:none}
.vals input{font-size:16px;-moz-appearance:textfield}
.vals input::-webkit-outer-spin-button,.vals input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.vals select{font-size:15px}
.lnk{min-height:44px;padding:0 8px;font-size:15px;font-weight:400}
.lnk.del{color:var(--muted)}
.addrow{display:block;width:100%;min-height:52px;text-align:left;padding:0 14px;font-weight:400;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:26px 14px;font-size:15px}

/* buttons */
.btn{display:block;width:100%;min-height:52px;border-radius:14px;font-size:17px;font-weight:400;padding:0 16px;
  background:var(--text);color:var(--bg);margin-top:12px}
.btn.line{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.on{background:var(--sec);color:var(--bg)}
.btn.danger{background:var(--text);color:var(--bg)}
.foot{margin-top:18px}

/* timer */
.timer{background:var(--panel);border-radius:16px;padding:18px 16px 16px;text-align:center;margin-bottom:4px}
.tlabel{color:var(--muted);font-size:15px}
.tclock{font-size:84px;font-weight:200;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tsub{font-weight:400;min-height:24px}
.tbtns{display:flex;gap:10px;margin-top:4px}
.tbtns .btn{flex:1}
.tnote{color:var(--muted);font-size:13px;margin:12px 0 0}

/* sheets */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
#modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;
  padding:20px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px)}
.sheet h3{margin:0 0 6px;font-size:20px}
.sheet p{margin:0 0 12px;color:var(--muted);font-size:15px}
.sheet input[type=text],.sheet textarea{width:100%;border-radius:12px;border:0;background:var(--field);padding:14px;font-size:17px}
.sheet textarea{height:110px;font:13px/1.4 ui-monospace,Menlo,monospace;resize:none}
.sheet .msg{font-weight:400;font-size:15px;min-height:22px;margin:8px 0 0}
.sheet hr{border:0;border-top:1px solid var(--line);margin:18px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
(function(){
'use strict';

var KEY = 'workoutTracker.v1';
var SECTIONS = {
  physio: { label:'Physio', days:[['mon','Mon'],['tue','Tues'],['wed','Wed'],['thu','Thurs'],['fri','Fri']] },
  gym:    { label:'Gym',    days:[['chest','Chest'],['back','Back'],['shoulders','Shoulders']] }
};
/* Kettlebell: optional extra, not ticked and not counted. Two 10-minute halves. */
var KB = [['kb:first','First 10 min'],['kb:second','Second 10 min']];
var BANDS = ['None','Extra Light','Light','Medium','Heavy','Extra Heavy'];
var LIMITS = { reps:[0,999], sets:[0,99], weight:[0,2000] };
var TOTAL = 1200, HALF = 600, READY = 3;   /* timer, in seconds */

var app = document.getElementById('app');
var modal = document.getElementById('modal');
var sheet = document.getElementById('sheet');
var view = { screen:'home', section:null, day:null, edit:false };
var state = load();

/* ---------- dates ---------- */
function monday(){
  var d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d;
}
function weekKey(){
  var d = monday();
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
function weekLabel(){
  return 'Week of ' + monday().toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

/* ---------- data ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function dayKey(s,d){ return s + ':' + d; }
function typeOf(key){ return key.split(':')[0]; }           /* physio | gym | kb */
function allKeys(){
  var keys = [];
  Object.keys(SECTIONS).forEach(function(s){
    SECTIONS[s].days.forEach(function(d){ keys.push(dayKey(s, d[0])); });
  });
  KB.forEach(function(h){ keys.push(h[0]); });
  return keys;
}
function clamp(n, f){
  var L = LIMITS[f]; n = Number(n);
  if (!isFinite(n)) n = L[0];
  if (f !== 'weight') n = Math.round(n); else n = Math.round(n*100)/100;
  return Math.min(L[1], Math.max(L[0], n));
}
/* Starting exercises for a fresh install. Each physio day gets its own copy. */
function starter(){
  var physio = [
    ['Standing Psoas March','Heavy'],
    ['Monster Walks + Squats','Heavy'],
    ['Bird Dogs + Fire Hydrants','Heavy'],
    ['Clamshells','Light'],
    ['Side Lying Hip Abduction','None'],
    ['Sitting One Leg Back & Forths','Heavy'],
    ['Optional: Foot Lifts / Pulls','Heavy']
  ];
  /* Gym: [name, weight lbs, reps, sets] */
  var gym = {
    chest: [
      ['Dumbbell press', 65, 8, 3],
      ['Dumbbell bicep curls', 30, 8, 3],
      ['Pec deck', 165, 10, 3],
      ['Barbell bicep curls', 50, 10, 3],
      ['Romanian deadlift', 42.5, 10, 3],
      ['Leg extensions', 100, 8, 3]
    ],
    back: [
      ['Straight-arm lats', 65, 12, 3],
      ['Tricep cable push', 65, 12, 3],
      ['Chest-supported rows', 100, 12, 3],
      ['Plate shrugs', 45, 15, 3],
      ['Calves', 145, 12, 3],
      ['Hip abductor (in)', 105, 10, 3],
      ['Hip abductor (out)', 120, 10, 3]
    ],
    shoulders: [
      ['Seated dumbbell press', 37.5, 10, 3],
      ['Standing dumbbell lateral raise', 15, 10, 3],
      ['Reverse pec-deck fly', 100, 10, 3],
      ['Romanian deadlift', 37.5, 10, 3],
      ['Leg extensions', 85, 8, 3]
    ]
  };
  /* Kettlebell: [name, reps] */
  var kb = {
    'kb:first':  [['Swings', 5], ['High pulls', 5], ['Goblet squats', 5]],
    'kb:second': [['Shoulder presses', 5], ['Standing oblique crunches', 10], ['Tabletop crunches', 5]]
  };
  var days = {};
  SECTIONS.physio.days.forEach(function(d){
    days['physio:' + d[0]] = physio.map(function(p){
      return { id:uid(), name:p[0], band:p[1], reps:10, sets:3 };
    });
  });
  Object.keys(gym).forEach(function(k){
    days['gym:' + k] = gym[k].map(function(g){
      return { id:uid(), name:g[0], weight:g[1], reps:g[2], sets:g[3] };
    });
  });
  Object.keys(kb).forEach(function(k){
    days[k] = kb[k].map(function(x){ return { id:uid(), name:x[0], reps:x[1] }; });
  });
  return days;
}
/* Makes any loaded/imported data safe and complete. Throws if it isn't workout data. */
function normalize(raw){
  if (!raw || typeof raw !== 'object' || !raw.days || typeof raw.days !== 'object') throw new Error('bad');
  var out = { v:1, weekKey: typeof raw.weekKey === 'string' ? raw.weekKey : weekKey(), ticks:{}, days:{} };
  var def = null;
  allKeys().forEach(function(k){
    var type = typeOf(k), list = raw.days[k];
    if (!Array.isArray(list)){
      /* Data saved before Kettlebell existed: give it the starting Kettlebell list. */
      if (type === 'kb'){ def = def || starter(); list = def[k]; } else list = [];
    }
    out.days[k] = list.filter(function(e){ return e && typeof e === 'object'; }).map(function(e){
      var x = { id: String(e.id || uid()), name: String(e.name || 'Exercise').slice(0,80), reps: clamp(e.reps, 'reps') };
      if (type !== 'kb') x.sets = clamp(e.sets, 'sets');
      if (type === 'physio') x.band = BANDS.indexOf(e.band) >= 0 ? e.band : 'Light';
      if (type === 'gym') x.weight = clamp(e.weight, 'weight');
      return x;
    });
    if (type !== 'kb' && raw.ticks && raw.ticks[k]) out.ticks[k] = true;
  });
  return out;
}
function load(){
  var s = null;
  try { s = normalize(JSON.parse(localStorage.getItem(KEY))); } catch(e){ s = null; }
  if (!s) s = normalize({ days: starter() });
  return s;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
}
/* New week (Monday) -> clear ticks, keep exercises. */
function checkWeek(){
  var k = weekKey();
  if (state.weekKey !== k){ state.weekKey = k; state.ticks = {}; save(); return true; }
  return false;
}
function countTicks(s){
  return SECTIONS[s].days.filter(function(d){ return state.ticks[dayKey(s,d[0])]; }).length;
}
function findEx(id){
  var keys = allKeys();
  for (var i=0;i<keys.length;i++){
    var list = state.days[keys[i]];
    for (var j=0;j<list.length;j++) if (list[j].id === id) return { key:keys[i], ex:list[j] };
  }
  return null;
}

/* ---------- rendering ---------- */
function esc(t){
  return String(t).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function render(){
  checkWeek();
  app.setAttribute('data-sec', view.screen === 'home' ? '' : (view.section || ''));
  var metas = document.querySelectorAll('meta[name=theme-color]'), home = view.screen === 'home';
  if (metas.length === 2){ metas[0].content = home ? '#f8ecae' : '#f5f5f7'; metas[1].content = home ? '#4a4118' : '#000000'; }
  if (view.screen === 'section') app.innerHTML = sectionHTML();
  else if (view.screen === 'day') app.innerHTML = dayHTML();
  else if (view.screen === 'kb'){ app.innerHTML = kbHTML(); paintTimer(); }
  else app.innerHTML = homeHTML();
}
function dots(s){
  return '<span class="dots">' + SECTIONS[s].days.map(function(d){
    return '<i' + (state.ticks[dayKey(s,d[0])] ? ' class="on"' : '') + '></i>';
  }).join('') + '</span>';
}
function homeHTML(){
  var p = countTicks('physio'), g = countTicks('gym');
  return '<div class="home"><div class="band"><div class="hdr"><h1>Move</h1><button class="icon" data-act="backup" aria-label="Backup: export or import">' +
    '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M12 15V4M8 8l4-4 4 4M5 14v5h14v-5"/></svg></button></div></div>' +
    '<p class="wk"><b>' + weekLabel() + '</b></p><div class="mid">' +
    '<button class="big physio" data-act="section" data-s="physio" aria-label="Physio, ' + p + ' of 5 done"><span class="t">Physio</span>' + dots('physio') + '</button>' +
    '<button class="big gym" data-act="section" data-s="gym" aria-label="Gym, ' + g + ' of 3 done"><span class="t">Gym</span>' + dots('gym') + '</button></div></div>';
}
function sectionHTML(){
  var s = view.section, sec = SECTIONS[s], n = countTicks(s);
  var h = '<div class="top"><button data-act="home">‹ Home</button></div><h2>' + sec.label + '</h2>' +
    '<p class="wk"><b>' + weekLabel() + '</b><span>' + n + ' of ' + sec.days.length + ' done</span></p><div class="panel">';
  sec.days.forEach(function(d){
    var on = !!state.ticks[dayKey(s, d[0])];
    h += '<div class="row"><button class="tick' + (on ? ' on' : '') + '" data-act="tick" data-d="' + d[0] + '" aria-label="Tick ' + d[1] +
      ' as done" aria-pressed="' + on + '"><i>✓</i></button>' +
      '<button class="open" data-act="day" data-d="' + d[0] + '"><span>' + d[1] + '</span><span class="chev">›</span></button></div>';
  });
  h += '</div>';
  if (s === 'gym'){
    h += '<p class="grp">Optional extra</p><div class="panel"><div class="row"><button class="open solo" data-act="kb">' +
      '<span>Kettlebell</span><span class="meta">EMOM · 20 min &nbsp;<span class="chev">›</span></span></button></div></div>';
  }
  return h;
}
function num(e, f, cls){
  return '<input class="' + cls + '" type="number" inputmode="' + (f === 'weight' ? 'decimal' : 'numeric') + '" data-id="' + e.id +
    '" data-f="' + f + '" value="' + e[f] + '" aria-label="' + f + '">';
}
/* One grouped list of exercises for a list key. */
function listHTML(key, id){
  var type = typeOf(key), list = state.days[key], h = '<div class="panel"' + (id ? ' id="' + id + '"' : '') + '>';
  if (!list.length && !view.edit) h += '<div class="empty">No exercises yet. Tap Edit to add one.</div>';
  if (list.length && !view.edit){
    h += '<div class="heads"><span class="sp"></span>';
    if (type === 'physio') h += '<span class="wb">Band</span>';
    if (type === 'gym') h += '<span class="ww">Lbs</span>';
    h += '<span class="' + (type === 'kb' ? 'ww' : 'wn') + '">Reps</span>';
    if (type !== 'kb') h += '<span class="wn">Sets</span>';
    h += '</div>';
  }
  list.forEach(function(e){
    h += '<div class="ex"><span class="nm">' + esc(e.name) + '</span><span class="vals">';
    if (view.edit){
      h += '<button class="lnk" data-act="rename" data-id="' + e.id + '">Rename</button>' +
           '<button class="lnk del" data-act="delete" data-id="' + e.id + '">Delete</button>';
    } else {
      if (type === 'physio'){
        h += '<select class="wb" data-id="' + e.id + '" data-f="band" aria-label="band">' +
          BANDS.map(function(b){ return '<option' + (b === e.band ? ' selected' : '') + '>' + b + '</option>'; }).join('') + '</select>';
      }
      if (type === 'gym') h += num(e, 'weight', 'ww');
      h += num(e, 'reps', type === 'kb' ? 'ww' : 'wn');
      if (type !== 'kb') h += num(e, 'sets', 'wn');
    }
    h += '</span></div>';
  });
  if (view.edit) h += '<button class="addrow" data-act="add" data-k="' + key + '">+ Add exercise</button>';
  return h + '</div>';
}
function topBar(backAct, backLabel, backS){
  return '<div class="top"><button data-act="' + backAct + '"' + (backS ? ' data-s="' + backS + '"' : '') + '>‹ ' + backLabel + '</button>' +
    '<button class="edit" data-act="edit">' + (view.edit ? 'Done' : 'Edit') + '</button></div>';
}
function dayHTML(){
  var s = view.section, sec = SECTIONS[s], k = dayKey(s, view.day);
  var dl = sec.days.filter(function(d){ return d[0] === view.day; })[0][1];
  var on = !!state.ticks[k];
  var h = topBar('section', sec.label, s) + '<h2>' + dl + '</h2><p class="wk"><span>' + sec.label + '</span></p>' + listHTML(k);
  if (!view.edit){
    h += '<div class="foot"><button class="btn ' + (on ? 'on' : 'line') + '" data-act="tick" data-d="' + view.day + '">' +
      (on ? '✓ Done this week' : 'Mark ' + dl + ' done') + '</button></div>';
  }
  return h;
}
function kbHTML(){
  var h = topBar('section', 'Gym', 'gym') + '<h2>Kettlebell</h2><p class="wk"><span>EMOM · 20 min · optional extra</span></p>';
  if (!view.edit){
    h += '<div class="timer"><div class="tlabel" id="tlabel"></div><div class="tclock" id="tclock"></div><div class="tsub" id="tsub"></div>' +
      '<div class="tbtns"><button class="btn go" id="tgo" data-act="tgo"></button><button class="btn line" data-act="treset">Reset</button></div>' +
      '<p class="tnote" id="tnote"></p></div>';
  }
  KB.forEach(function(half, i){
    h += '<p class="grp">' + half[1] + '</p>' + listHTML(half[0], 'half' + i);
  });
  return h;
}

/* ---------- EMOM timer ---------- */
/* T.t runs from -READY (get-ready countdown) to TOTAL seconds. It follows the clock, so it stays right after a pause in the background. */
var T = { state:'idle', t:-READY, base:0, last:0, iv:null, ac:null, lock:null, note:'' };

function audioInit(){
  try {
    /* 'ambient' lets the clicks play over music from another app. It also means they follow the silent switch. */
    if (navigator.audioSession) navigator.audioSession.type = 'ambient';
  } catch(e){}
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!T.ac && AC) T.ac = new AC();
    if (T.ac && T.ac.state !== 'running') T.ac.resume();
  } catch(e){}
}
/* A short click. loud = the sharp on-the-minute clack; otherwise a soft tick. */
function click(delay, loud){
  var ac = T.ac; if (!ac) return;
  try {
    var t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = loud ? 'square' : 'sine';
    o.frequency.setValueAtTime(loud ? 1700 : 1100, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(loud ? 0.9 : 0.22, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (loud ? 0.075 : 0.03));
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + 0.12);
  } catch(e){}
}
/* What sounds at second s of the timeline. */
function cue(s){
  if (s < 0) click(0, false);                                   /* get ready: 3-2-1 */
  else if (s === TOTAL){ click(0, true); click(0.17, true); click(0.34, true); }   /* finish: three clicks */
  else if (s === HALF){ click(0, true); click(0.17, true); }   /* halfway: two clicks */
  else if (s % 60 === 0) click(0, true);                        /* each minute: one sharp click */
  else if (s % 60 >= 57) click(0, false);                       /* warning: last 3 seconds */
}
function lockOn(){
  if (!('wakeLock' in navigator)){
    T.note = 'This iPhone can’t keep the screen awake for a web app. Tap the screen now and then so it doesn’t lock.';
    return;
  }
  try {
    navigator.wakeLock.request('screen').then(function(l){
      T.lock = l; T.note = 'The screen will stay on while the timer runs.';
      l.addEventListener('release', function(){ if (T.lock === l) T.lock = null; });
      paintTimer();
    }, function(){
      T.note = 'Couldn’t keep the screen awake. Tap the screen now and then so it doesn’t lock.';
      paintTimer();
    });
  } catch(e){}
}
function lockOff(){
  if (T.lock){ try { T.lock.release(); } catch(e){} T.lock = null; }
}
function timerStart(){
  audioInit();
  var fresh = T.state === 'idle' || T.state === 'done';
  if (fresh) T.t = -READY;
  T.base = Date.now() - T.t * 1000;
  T.last = fresh ? Math.floor(T.t) - 1 : Math.floor(T.t);
  T.state = 'run';
  lockOn();
  clearInterval(T.iv);
  T.iv = setInterval(timerLoop, 100);
  timerLoop();
}
function timerPause(){
  if (T.state !== 'run') return;
  T.t = (Date.now() - T.base) / 1000;
  T.state = 'paused';
  clearInterval(T.iv); lockOff(); paintTimer();
}
function timerReset(){
  clearInterval(T.iv); lockOff();
  T.state = 'idle'; T.t = -READY; T.note = '';
  paintTimer();
}
function timerLoop(){
  if (T.state !== 'run') return;
  T.t = (Date.now() - T.base) / 1000;
  var s = Math.floor(T.t);
  if (s > T.last){
    /* Only sound cues we are on time for; skip any missed while the app was in the background. */
    if (s - T.last <= 2) for (var i = T.last + 1; i <= s && i <= TOTAL; i++) cue(i);
    T.last = s;
  }
  if (T.t >= TOTAL){ T.state = 'done'; T.t = TOTAL; clearInterval(T.iv); lockOff(); }
  paintTimer();
}
function paintTimer(){
  var clock = document.getElementById('tclock'); if (!clock) return;
  var label = document.getElementById('tlabel'), sub = document.getElementById('tsub');
  var go = document.getElementById('tgo'), note = document.getElementById('tnote');
  var half = -1, t = T.t;
  if (T.state === 'idle'){
    label.textContent = ''; clock.textContent = '20:00'; sub.textContent = ''; go.textContent = 'Start';
  } else if (T.state === 'done'){
    label.textContent = '20 minutes'; clock.textContent = 'Done'; sub.textContent = 'Nice work'; go.textContent = 'Start again';
  } else {
    go.textContent = T.state === 'run' ? 'Pause' : 'Resume';
    if (t < 0){
      label.textContent = 'Get ready'; clock.textContent = String(Math.ceil(-t)); sub.textContent = 'First half'; half = 0;
    } else {
      var m = Math.min(19, Math.floor(t / 60));
      label.textContent = 'Minute ' + (m + 1) + ' of 20';
      clock.textContent = String(Math.max(1, Math.ceil(60 - (t - m * 60))));
      half = m < 10 ? 0 : 1;
      sub.textContent = (half ? 'Second half' : 'First half') + (T.state === 'paused' ? ' · paused' : '');
    }
  }
  note.textContent = T.state === 'idle' ? '' : T.note;
  note.style.display = note.textContent ? '' : 'none';
  sub.style.display = sub.textContent ? '' : 'none';
  for (var i = 0; i < KB.length; i++){
    var p = document.getElementById('half' + i);
    if (p) p.classList.toggle('now', i === half);
  }
}

/* ---------- modal sheets ---------- */
function openSheet(html){ sheet.innerHTML = html; modal.classList.add('show'); }
function closeSheet(){ modal.classList.remove('show'); sheet.innerHTML = ''; }
function nameSheet(title, value, onSave){
  openSheet('<h3>' + title + '</h3><input type="text" id="nm" maxlength="80" placeholder="Exercise name" autocomplete="off" value="' + esc(value) + '">' +
    '<button class="btn" id="ok">Save</button><button class="btn line" data-act="close">Cancel</button>');
  var input = document.getElementById('nm');
  function go(){ var v = input.value.trim(); if (!v){ input.focus(); return; } onSave(v); closeSheet(); save(); render(); }
  document.getElementById('ok').onclick = go;
  input.onkeydown = function(ev){ if (ev.key === 'Enter') go(); };
  input.focus(); input.select();
}
function deleteSheet(found){
  openSheet('<h3>Delete this exercise?</h3><p>“' + esc(found.ex.name) + '” will be removed. This can’t be undone.</p>' +
    '<button class="btn danger" id="ok">Yes, delete it</button><button class="btn line" data-act="close">Cancel</button>');
  document.getElementById('ok').onclick = function(){
    state.days[found.key] = state.days[found.key].filter(function(x){ return x.id !== found.ex.id; });
    closeSheet(); save(); render();
  };
}
function backupSheet(){
  openSheet('<h3>Export (make a backup)</h3><p>Copy this text and keep it somewhere safe, like the Notes app.</p>' +
    '<textarea id="exp" readonly></textarea><button class="btn" id="copy">Copy backup text</button><div class="msg" id="cmsg"></div>' +
    '<hr><h3>Import (restore a backup)</h3><p>Paste backup text here. This replaces everything currently in the app.</p>' +
    '<textarea id="imp" placeholder="Paste backup text here"></textarea><button class="btn line" id="doimp">Replace my data with this</button>' +
    '<div class="msg" id="imsg"></div><button class="btn line" data-act="close">Close</button>');
  var exp = document.getElementById('exp'), imp = document.getElementById('imp');
  var cmsg = document.getElementById('cmsg'), imsg = document.getElementById('imsg'), btn = document.getElementById('doimp');
  exp.value = JSON.stringify(state);
  document.getElementById('copy').onclick = function(){
    function ok(){ cmsg.textContent = 'Copied ✓'; }
    function fallback(){
      exp.focus(); exp.select(); exp.setSelectionRange(0, exp.value.length);
      var done = false; try { done = document.execCommand('copy'); } catch(e){}
      cmsg.textContent = done ? 'Copied ✓' : 'Text is selected — tap it and choose Copy.';
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(exp.value).then(ok, fallback);
    else fallback();
  };
  var armed = null;
  imp.oninput = function(){ armed = null; btn.textContent = 'Replace my data with this'; btn.className = 'btn line'; imsg.textContent = ''; };
  btn.onclick = function(){
    var parsed;
    try { parsed = normalize(JSON.parse(imp.value.trim())); }
    catch(e){ imsg.textContent = 'That doesn’t look like backup text. Nothing was changed.'; return; }
    if (!armed){
      armed = parsed; btn.textContent = 'Tap again to confirm'; btn.className = 'btn danger';
      imsg.textContent = 'This will overwrite your current exercises.'; return;
    }
    state = armed; checkWeek(); save(); closeSheet(); go('home');
  };
}

/* ---------- events ---------- */
function go(screen, section, day){
  if (screen !== 'kb') timerPause();
  view = { screen:screen, section:section || null, day:day || null, edit:false };
  render(); window.scrollTo(0,0);
}

document.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-act]');
  if (!t){ if (ev.target === modal) closeSheet(); return; }
  var act = t.getAttribute('data-act'), id = t.getAttribute('data-id'), found;
  if (act === 'home') go('home');
  else if (act === 'section') go('section', t.getAttribute('data-s'));
  else if (act === 'day') go('day', view.section, t.getAttribute('data-d'));
  else if (act === 'kb') go('kb', 'gym');
  else if (act === 'edit'){ view.edit = !view.edit; if (view.edit) timerPause(); render(); }
  else if (act === 'close') closeSheet();
  else if (act === 'backup') backupSheet();
  else if (act === 'tgo'){ if (T.state === 'run') timerPause(); else timerStart(); }
  else if (act === 'treset') timerReset();
  else if (act === 'tick'){
    checkWeek();
    var k = dayKey(view.section, t.getAttribute('data-d'));
    if (state.ticks[k]) delete state.ticks[k]; else state.ticks[k] = true;
    save(); render();
  }
  else if (act === 'add'){
    var key = t.getAttribute('data-k'), type = typeOf(key);
    nameSheet('New exercise', '', function(name){
      var x = { id:uid(), name:name, reps: type === 'kb' ? 5 : 10 };
      if (type !== 'kb') x.sets = 3;
      if (type === 'physio') x.band = 'Light';
      if (type === 'gym') x.weight = 0;
      state.days[key].push(x);
    });
  }
  else if (act === 'rename'){ found = findEx(id); if (found) nameSheet('Rename exercise', found.ex.name, function(name){ found.ex.name = name; }); }
  else if (act === 'delete'){ found = findEx(id); if (found) deleteSheet(found); }
});

app.addEventListener('change', function(ev){
  var t = ev.target, f = t.getAttribute('data-f'), found = findEx(t.getAttribute('data-id'));
  if (!f || !found) return;
  var e = found.ex;
  if (f === 'band'){ if (BANDS.indexOf(t.value) >= 0) e.band = t.value; }
  else if (f in e){ e[f] = clamp(t.value, f); t.value = e[f]; }
  save();
});
app.addEventListener('focusin', function(ev){
  if (ev.target.tagName === 'INPUT' && ev.target.type === 'number') { try { ev.target.select(); } catch(e){} }
});
app.addEventListener('keydown', function(ev){
  if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') ev.target.blur();
});

/* When the app comes back to the front: re-check the week, and wake the timer's sound and screen lock. */
document.addEventListener('visibilitychange', function(){
  if (document.hidden) return;
  if (checkWeek()) render();
  if (T.state === 'run'){ audioInit(); lockOn(); timerLoop(); }
});
window.addEventListener('pageshow', function(){ if (checkWeek()) render(); });

save();
render();
})();
</script>
</body>
</html>
